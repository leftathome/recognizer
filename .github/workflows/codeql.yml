name: CodeQL

# Mirrors glovebox's codeql.yml, extended with a Python matrix leg since the
# notification relay and the ARM post-rip hook are Python.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            images/archive-importer/go.sum
            images/document-scanner/scanner-session-manager/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Build only what compiles without the private walhelm-go module --
      # its sole remote is gitlab.orac.local, unreachable from GitHub-hosted
      # runners (same exclusion, and the same comment trail, as ci.yml's
      # test-go matrix).
      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          (cd images/document-scanner/scanner-session-manager && go build ./...)
          (cd images/archive-importer && go build \
            ./internal/delivery/... ./internal/ident/... ./internal/lock/... \
            ./internal/manifest/... ./internal/matcher/... ./internal/relay/... \
            ./internal/unpacker/... ./cmd/archive-importer/...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
