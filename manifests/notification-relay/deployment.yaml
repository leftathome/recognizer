apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-relay
  namespace: capture
  labels:
    app: notification-relay
    app.kubernetes.io/name: notification-relay
    app.kubernetes.io/part-of: capture-framework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-relay
  template:
    metadata:
      labels:
        app: notification-relay
        app.kubernetes.io/name: notification-relay
        app.kubernetes.io/part-of: capture-framework
    spec:
      containers:
        - name: relay
          image: ghcr.io/leftathome/notification-relay:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RELAY_PORT
              value: "8080"
            - name: DEAD_LETTER_DIR
              value: /out/notifications/dead-letter
            - name: RELAY_CONFIG_PATH
              value: /etc/relay/config.yaml
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notification-relay-tokens
                  key: discord-webhook-url
                  optional: true
            - name: PUSHOVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-relay-tokens
                  key: pushover-token
                  optional: true
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: relay-config
              mountPath: /etc/relay
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: incoming
          persistentVolumeClaim:
            claimName: incoming-nfs-pvc
        - name: relay-config
          configMap:
            name: relay-config
