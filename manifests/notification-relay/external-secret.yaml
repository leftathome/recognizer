apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-relay-tokens
  namespace: capture
  labels:
    app.kubernetes.io/part-of: capture-framework
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: notification-relay-tokens
    creationPolicy: Owner
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        key: notification-relay
        property: discord-webhook-url
    - secretKey: pushover-token
      remoteRef:
        key: notification-relay
        property: pushover-token
