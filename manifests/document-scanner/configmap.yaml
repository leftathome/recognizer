apiVersion: v1
kind: ConfigMap
metadata:
  name: scanner-config
  namespace: capture
  labels:
    app.kubernetes.io/name: document-scanner
    app.kubernetes.io/part-of: capture-framework
data:
  config.yaml: |
    idle_timeout_seconds: 90
    relay_url: "http://notification-relay.capture.svc.cluster.local:8080/event"
    scan_resolution: 600
    scan_color_mode: "Color"
    scan_format: "tiff"
    device_name: "epson-ds-1630"
