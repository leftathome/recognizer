apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: optical-ripper
  namespace: capture
  labels:
    app.kubernetes.io/name: optical-ripper
    app.kubernetes.io/part-of: capture-framework
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: optical-ripper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optical-ripper
        app.kubernetes.io/part-of: capture-framework
    spec:
      nodeSelector:
        openclaw.io/device-optical-drive: pioneer-bdr-xs07uhd
      containers:
        - name: arm
          image: automaticrippingmachine/automatic-ripping-machine:2.6.0
          env:
            - name: ARM_UID
              value: "1000"
            - name: ARM_GID
              value: "1000"
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: makemkv-license
                  key: license-key
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omdb-api
                  key: api-key
          resources:
            limits:
              smarter-devices/sr0: 1
              smarter-devices/sg0: 1
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: arm-config
              mountPath: /etc/arm/config
            - name: arm-home
              mountPath: /home/arm
          ports:
            - name: web-ui
              containerPort: 8080
      volumes:
        - name: incoming
          persistentVolumeClaim:
            claimName: incoming-nfs-pvc
        - name: arm-config
          configMap:
            name: arm-config
        - name: arm-home
          emptyDir: {}
