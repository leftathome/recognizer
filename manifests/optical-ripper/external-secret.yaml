apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: makemkv-license
  namespace: capture
  labels:
    app.kubernetes.io/part-of: capture-framework
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: makemkv-license
    creationPolicy: Owner
  data:
    - secretKey: license-key
      remoteRef:
        key: makemkv
        property: license-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: omdb-api
  namespace: capture
  labels:
    app.kubernetes.io/part-of: capture-framework
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: omdb-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: omdb
        property: api-key
