stages:
  - test

variables:
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Defaults applied to every job. The runner's chart-level defaults are very
  # small; explicit values here let each job request what it actually needs.
  # Override per-job by re-declaring the variable in a job's `variables:` block.
  KUBERNETES_CPU_REQUEST: "250m"
  KUBERNETES_CPU_LIMIT: "1"
  KUBERNETES_MEMORY_REQUEST: "512Mi"
  KUBERNETES_MEMORY_LIMIT: "1Gi"
  KUBERNETES_HELPER_CPU_REQUEST: "100m"
  KUBERNETES_HELPER_CPU_LIMIT: "500m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"

.cache:
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/

test:python:
  stage: test
  image: python:3.12-slim
  extends: .cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin/ kubeconform
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --tb=short --junitxml=report-python.xml
  # Artifact uploads currently return 405 from gitlab.orac.local while the
  # platform team finishes the gitaly/object-storage migration. Keep the
  # XML for re-enabling later.

test:go:
  stage: test
  image: golang:1.26-bookworm
  extends: .cache
  variables:
    GO_MODULE_DIR: images/document-scanner/scanner-session-manager
    # `go test -race` doubles memory footprint; allow more headroom.
    KUBERNETES_CPU_REQUEST: "500m"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "3Gi"
  before_script:
    # `go install` puts binaries in $GOPATH/bin; that path is NOT on $PATH by default.
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - go install github.com/jstemmer/go-junit-report/v2@latest
  script:
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - cd "$GO_MODULE_DIR"
    - go vet ./...
    - go test ./... -count=1 -race -v 2>&1 | go-junit-report -set-exit-code > "$CI_PROJECT_DIR/report-go.xml"

vuln:go:
  stage: test
  image: golang:1.26-bookworm
  extends: .cache
  variables:
    # govulncheck downloads the vulnerability database into memory.
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
  before_script:
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - cd images/document-scanner/scanner-session-manager
    - govulncheck ./...
  allow_failure: false

scan:trivy-fs:
  stage: test
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress .
  allow_failure: false

helm:lint:
  stage: test
  image:
    name: alpine/helm:3.14.4
    entrypoint: [""]
  script:
    - helm lint charts/recognizer
    # Pin --kube-version to the actual orac cluster version. Helm's offline
    # `template` defaults to the version compiled into the helm binary
    # (1.29 for alpine/helm:3.14.4), but the chart requires kubeVersion >=1.30.
    - helm template recognizer charts/recognizer --kube-version 1.34.0 --set nfs.server=nas.orac.local --namespace recognizer > render.yaml
    - wc -l render.yaml
