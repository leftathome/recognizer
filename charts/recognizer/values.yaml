# =============================================================================
# recognizer chart values.
#
# READ THE README BEFORE CHANGING DEFAULTS.
#   helm show readme oci://registry.orac.local/steve/recognizer/charts/recognizer
#
# Critical cluster prerequisites (not deployed by this chart):
#   - node-feature-discovery (NFD) operator -- produces the
#     recognizer.io/device-* labels that the DaemonSets nodeSelect on.
#   - smarter-device-manager -- satisfies the smarter-devices/* resource
#     limits used to expose /dev/sr*, /dev/sg*, /dev/bus/usb to pods.
#   - external-secrets-operator + ClusterSecretStore named vault-backend.
#   - A StorageClass matching storage.<backend>.storageClassName.
#   - An imagePullSecret in the release namespace.
#
# If any prereq is missing, disable the affected workload via *.enabled: false
# until it lands. notification-relay has no hardware deps and always works.
# =============================================================================

image:
  registry: registry.orac.local
  repository: steve/recognizer
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: recognizer-registry

createNamespace: false

commonLabels: {}
commonAnnotations: {}

storage:
  # When false, the chart renders no PV/PVC and the workloads will fail
  # to schedule. Set false only if you are managing the PVC externally
  # AND have already pointed `storage.existing.claimName` at it.
  enabled: true

  # Which storage backend to use:
  #   longhorn  — dynamic provisioning from a Longhorn StorageClass (default).
  #               Workloads pin to specific nodes via NFD nodeSelectors, so
  #               RWX is required. Longhorn provisions an NFS-share-manager
  #               pod under the hood when `accessModes: [ReadWriteMany]`.
  #   nfs       — static PV pointing at an external NFS export. Set
  #               storage.nfs.server before deploying.
  #   existing  — bring-your-own PVC. Skip chart-managed PV/PVC entirely;
  #               point storage.existing.claimName at the pre-existing PVC.
  backend: longhorn

  # Capacity + access modes apply to backend=longhorn and backend=nfs.
  size: 50Gi
  accessModes:
    - ReadWriteMany

  # Backend-specific config. Only the block matching `backend` is used.
  longhorn:
    storageClassName: longhorn
  nfs:
    server: ""                       # required when backend=nfs
    path: /mnt/tank/recognizer
    storageClassName: nfs-recognizer
    reclaimPolicy: Retain            # PV reclaim policy; chart-rendered PV
                                     # also carries helm.sh/resource-policy: keep
  existing:
    claimName: ""                    # required when backend=existing

networkPolicies:
  enabled: true

monitoring:
  enabled: true

documentScanner:
  enabled: true
  image:
    name: document-scanner
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      # Reserve one USB bus on the node via smarter-device-manager.
      # Without this, the pod schedules but the scanner hardware is
      # not passed through. Matches source manifests/document-scanner/daemonset.yaml.
      smarter-devices/bus-usb: 1
  # Pins to nodes labeled by NFD when the Epson DS-1630 USB device is plugged in.
  # See gitops configmap-nfd-worker-recognizer.yaml for the NFD rule that
  # generates this label. Override this selector to support additional scanner
  # models (each NFD rule produces a distinct recognizer.io/device-scanner label value).
  nodeSelector:
    recognizer.io/device-scanner: epson-ds-1630

notificationRelay:
  enabled: true
  image:
    name: notification-relay
    tag: ""
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

opticalRipper:
  enabled: true
  # NOTE: opticalRipper uses an upstream Docker Hub image, NOT one we build.
  # Its image schema (repository + tag) intentionally differs from
  # documentScanner/notificationRelay (which use name + tag composed via the
  # recognizer.image helper). Templates must render this image inline:
  #   image: "{{ .Values.opticalRipper.image.repository }}:{{ .Values.opticalRipper.image.tag }}"
  # NOT via the recognizer.image helper.
  image:
    repository: automaticrippingmachine/automatic-ripping-machine
    # 2.6.0 (the original default) was never published on Docker Hub -- the
    # 2.6.x line jumps straight to 2.6.42. 2.21.0 is a recent stable release
    # with multi-arch manifests (amd64/arm64/arm).
    tag: "2.23.2"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
      # Reserve the optical drive (sr0) and SCSI generic device (sg0) on the
      # node via smarter-device-manager. ARM needs both to read discs and
      # eject the tray. Matches source manifests/optical-ripper/daemonset.yaml.
      smarter-devices/sr0: 1
      smarter-devices/sg0: 1
  # Pins to nodes labeled by NFD when the Pioneer BDR-XS07UHD optical drive
  # is plugged in. See gitops configmap-nfd-worker-recognizer.yaml for the
  # NFD rule that generates this label. Override to support additional
  # drive models (each NFD rule produces a distinct
  # recognizer.io/device-optical-drive label value).
  nodeSelector:
    recognizer.io/device-optical-drive: pioneer-bdr-xs07uhd

# ============================================================================
# archive-importer (spec 03): one-shot/CronJob that ingests Google Takeout
# (and future) archives. Disabled by default for Phase D rollout; enable
# per release once the image is built and Vault paths are populated.
# ============================================================================
archiveImporter:
  enabled: true
  image:
    name: archive-importer
    tag: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  config:
    dataRoot: /data/incoming/archives
    relayUrl: ""              # empty -> recognizer.relayUrl helper
    includeUnrecognized: false
    logLevel: info
