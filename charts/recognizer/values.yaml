# =============================================================================
# recognizer chart values.
#
# READ THE README BEFORE CHANGING DEFAULTS.
#   helm show readme oci://registry.orac.local/steve/recognizer/charts/recognizer
#
# Critical cluster prerequisites (not deployed by this chart):
#   - node-feature-discovery (NFD) operator -- produces the
#     recognizer.io/device-* labels that the DaemonSets nodeSelect on.
#   - smarter-device-manager -- satisfies the smarter-devices/* resource
#     limits used to expose /dev/sr*, /dev/sg*, /dev/bus/usb to pods.
#   - external-secrets-operator + ClusterSecretStore named vault-backend.
#   - A StorageClass matching storage.<backend>.storageClassName.
#   - An imagePullSecret in the release namespace.
#
# If any prereq is missing, disable the affected workload via *.enabled: false
# until it lands. notification-relay has no hardware deps and always works.
# =============================================================================

image:
  registry: registry.orac.local
  repository: steve/recognizer
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: recognizer-registry

createNamespace: false

# -----------------------------------------------------------------------------
# Hardware-attached workloads (optical-ripper, document-scanner) run in a
# dedicated namespace with relaxed Pod Security so they can reach the host
# device tree (/dev) and udev, and thus self-discover dynamically-enumerated
# optical/scanner devices. The main release namespace stays PSS=restricted so
# the importer/API/relay keep the tighter posture. See archiver-6ix and
# docs/optical-ingest-e2e-plan.md.
hardware:
  # When true, render the hardware namespace and place hardware-attached
  # workloads there. When false, those workloads render in the release
  # namespace (legacy single-namespace behavior, PSS=restricted).
  enabled: true
  namespace: recognizer-hardware
  # Pod Security Standards level enforced on the hardware namespace.
  # 'privileged' is required for hostPath /dev + privileged containers.
  podSecurityStandard: privileged

  # Data volume the hardware-ns workloads mount at /out. PVCs are namespaced,
  # so this is separate from the release-namespace data volume.
  data:
    # scratch -> throwaway RWO PVC on a least-durable StorageClass. Use until
    #            the NAS is available; the importer hand-off is deferred
    #            (importer is in the release ns and can't read this volume).
    # nfs     -> cross-namespace NFS PV+PVC sharing /out with the importer
    #            (set when the NAS is cabled; reuses storage.nfs.*).
    mode: scratch
    scratch:
      # Least-durable class in the cluster: single replica, Delete reclaim.
      storageClassName: longhorn-single-replica
      accessMode: ReadWriteOnce
      size: 50Gi

commonLabels: {}
commonAnnotations: {}

storage:
  # When false, the chart renders no PV/PVC and the workloads will fail
  # to schedule. Set false only if you are managing the PVC externally
  # AND have already pointed `storage.existing.claimName` at it.
  enabled: true

  # Which storage backend to use:
  #   longhorn  — dynamic provisioning from a Longhorn StorageClass (default).
  #               Workloads pin to specific nodes via NFD nodeSelectors, so
  #               RWX is required. Longhorn provisions an NFS-share-manager
  #               pod under the hood when `accessModes: [ReadWriteMany]`.
  #   nfs       — static PV pointing at an external NFS export. Set
  #               storage.nfs.server before deploying.
  #   existing  — bring-your-own PVC. Skip chart-managed PV/PVC entirely;
  #               point storage.existing.claimName at the pre-existing PVC.
  backend: longhorn

  # Capacity + access modes apply to backend=longhorn and backend=nfs.
  size: 50Gi
  accessModes:
    - ReadWriteMany

  # Backend-specific config. Only the block matching `backend` is used.
  longhorn:
    storageClassName: longhorn
  nfs:
    server: ""                       # required when backend=nfs
    path: /mnt/tank/recognizer
    storageClassName: nfs-recognizer
    reclaimPolicy: Retain            # PV reclaim policy; chart-rendered PV
                                     # also carries helm.sh/resource-policy: keep
  existing:
    claimName: ""                    # required when backend=existing

networkPolicies:
  enabled: true

monitoring:
  enabled: true

documentScanner:
  enabled: true
  image:
    name: document-scanner
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
      # No smarter-devices claim here. The old `smarter-devices/bus-usb: 1`
      # limit never passed the scanner through: smarter-device-manager
      # advertises per-node-path resources and the scanner's USB bus node is
      # enumeration-dependent, so the name never matched. The driver reaches
      # the device via hostPath /dev in the hardware namespace instead (see
      # document-scanner/daemonset.yaml).
  # Pins to nodes labeled by NFD when the Epson DS-1630 USB device is plugged in.
  # See gitops configmap-nfd-worker-recognizer.yaml for the NFD rule that
  # generates this label. Override this selector to support additional scanner
  # models (each NFD rule produces a distinct recognizer.io/device-scanner label value).
  nodeSelector:
    recognizer.io/device-scanner: epson-ds-1630

notificationRelay:
  enabled: true
  image:
    name: notification-relay
    tag: ""
  replicaCount: 2
  # Bounded in-memory queue between the HTTP handler and the delivery
  # worker pool (images/notification-relay/relay/main.py RelayServer).
  # Past this many events waiting for a worker, new ones are dead-lettered
  # immediately instead of blocking the request thread. Matches the code's
  # own RELAY_QUEUE_MAX default -- set here so it's tunable per release
  # without touching the image.
  queueMax: 1000
  # Background worker threads draining the delivery queue (RELAY_WORKERS).
  workers: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Dead-letter directory behavior, shared between the relay Deployment
  # (which writes dead-letters on delivery failure / queue-full) and the
  # drain CronJob below (which re-delivers and deletes them, or ages them
  # out). See images/notification-relay/relay/deadletter.py and drain.py.
  deadLetter:
    # Refuse new dead-letter writes once the directory holds this many
    # files (RELAY_DEADLETTER_MAX) -- caps growth on the shared PVC.
    maxFiles: 10000
    # Hourly CronJob that re-POSTs each dead-lettered event to the
    # configured destinations, deleting the file on full success and
    # leaving it in place (for the next run) on any destination failure.
    drain:
      enabled: true
      schedule: "0 * * * *"   # hourly
      suspend: false
      # Age out (delete, loudly logged) dead-letter files older than this
      # many days instead of retrying them forever (RELAY_DEADLETTER_MAX_AGE_DAYS).
      maxAgeDays: 14
      # Cap on files touched per run (RELAY_DRAIN_BATCH), so a large
      # backlog can't make one invocation run unboundedly long -- the
      # remainder waits for the next scheduled fire.
      batchSize: 500
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi

opticalRipper:
  enabled: true
  # NOTE: opticalRipper uses an upstream Docker Hub image, NOT one we build.
  # Its image schema (repository + tag) intentionally differs from
  # documentScanner/notificationRelay (which use name + tag composed via the
  # recognizer.image helper). Templates must render this image inline:
  #   image: "{{ .Values.opticalRipper.image.repository }}:{{ .Values.opticalRipper.image.tag }}"
  # NOT via the recognizer.image helper.
  image:
    repository: automaticrippingmachine/automatic-ripping-machine
    # 2.6.0 (the original default) was never published on Docker Hub -- the
    # 2.6.x line jumps straight to 2.6.42. 2.23.2 is a recent stable release (auto-bumped by Renovate)
    # with multi-arch manifests (amd64/arm64/arm).
    tag: "2.23.2"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
      # Device access is handled by the daemonset based on hardware.enabled:
      #   hardware.enabled=true  -> privileged + hostPath /dev (self-discovers
      #     the drive's sr0 + dynamic sg node). No smarter-devices/* needed.
      #   hardware.enabled=false -> the daemonset re-adds smarter-devices/sr0
      #     + sg0 here (legacy PSS=restricted path; fragile, see daemonset).
  # Pins to nodes labeled by NFD when the Pioneer BDR-XS07UHD optical drive
  # is plugged in. See gitops configmap-nfd-worker-recognizer.yaml for the
  # NFD rule that generates this label. Override to support additional
  # drive models (each NFD rule produces a distinct
  # recognizer.io/device-optical-drive label value).
  nodeSelector:
    recognizer.io/device-optical-drive: pioneer-bdr-xs07uhd

  # Behavior when the drive connects with a disc ALREADY loaded. No media-change
  # uevent fires in that case (the media was present before the device), so ARM
  # stays idle. A postStart "optical tender" handles it. See archiver-9vq.
  #   import -> run ARM's pipeline on the loaded disc (identify -> dedupe-skip if
  #             already imported, ejecting with a reason -> rip if new -> eject)
  #   eject  -> eject immediately, forcing a deliberate re-insert to import
  onConnectWithDisc: import

  # Keep the drive's physical eject button working when idle. A SCSI medium-
  # removal lock left set by a MakeMKV probe (or an aborted rip) disables the
  # button; the tender clears the manual-eject inhibit at startup and, while no
  # rip is active, on an interval. See archiver-7xe.
  ejectGuard:
    enabled: true
    intervalSeconds: 30

  # ARM's job database (DBFILE=/home/arm/db/arm.db) holds rip history, dedupe
  # records, and per-job metadata. /home/arm is an emptyDir (raw rips go to fast
  # node-local scratch), so without a dedicated persistent volume here the DB --
  # and therefore dedupe ("already-ripped disc skipped") plus the archiver-yzp
  # re-identify hook -- is wiped on every pod restart. See archiver-kx9.
  # Footprint is ~5 KB/disc, so 2Gi covers thousands of discs plus local
  # backups with room to spare; longhorn (3-replica) is used since this catalog
  # warrants more durability than the /out rip scratch, and the class allows
  # online expansion if needed.
  database:
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: longhorn

# ============================================================================
# archive-importer (spec 03): one-shot/CronJob that ingests Google Takeout
# (and future) archives. Disabled by default for Phase D rollout; enable
# per release once the image is built and Vault paths are populated.
# ============================================================================
archiveImporter:
  enabled: true
  image:
    name: archive-importer
    tag: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  config:
    dataRoot: /data/incoming/archives
    relayUrl: ""              # empty -> recognizer.relayUrl helper
    includeUnrecognized: false
    logLevel: info
  # Glovebox archive-delivery (spec 13 / tus.io). When enabled, recognized
  # subtrees push to glovebox's /v1/archives endpoint after the matcher
  # pass and Delivery records land in the manifest.
  #
  # Operator prerequisite (one-shot, NOT chart-renderable):
  #   kubectl label ns recognizer name=openclaw-recognizer
  # Without that label glovebox's NetworkPolicy drops every packet at L4
  # and the client sees TCP timeouts, not HTTP 401s.
  #
  # Supported glovebox floor: app version 0.6.4 or later. Older versions
  # (≤0.6.3) kill archive uploads >60s via a 60s ReadTimeout; multi-GB
  # uploads fail with curl (55) broken pipe.
  #
  # mTLS covers /v1/ingest only; /v1/archives stays bearer-token auth.
  # Before the operator flips ingest.tls.mode to `required`, verify the
  # deployed glovebox contains the bearer-listener fix (planPlaintextListeners).
  # Without it, /v1/archives goes offline and our uploads get connection-refused.
  #
  # Coming change: config.ingest.bearerPort will split /v1/archives onto
  # its own listener (default 0 = shared 9091). When the operator sets it,
  # update this url's port in the same maintenance window. Full URL is
  # operator-configurable; no code change needed.
  gloveboxIngest:
    enabled: false
    url: "http://glovebox.glovebox.svc.cluster.local:9091"
    # source_id under ^[a-z][a-z0-9]*(-[a-z0-9]+)*$, <=64 chars. Smoke-
    # test uses "recognizer-smoke-test"; production uses whatever you
    # negotiated with the glovebox operator.
    sourceID: "recognizer-smoke-test"
    # Egress target for the CiliumNetworkPolicy (networkpolicies.yaml). Must
    # track the host:port in `url` above -- when the operator lands the
    # bearerPort migration noted above and moves /v1/archives off the shared
    # 9091 listener, update `port` here in the same maintenance window.
    egress:
      namespace: glovebox
      port: 9091
    vault:
      refreshInterval: "1m"
      secretStoreRef:
        name: "vault-backend"
        kind: "ClusterSecretStore"
    # Forward wiring for the day glovebox's bearer listener requires TLS
    # (server side is plaintext today; see
    # docs/analysis/glovebox-integration-review.md §7). Both fields
    # render nothing when left at their defaults, so the default render
    # stays byte-identical.
    tls:
      # Name of a ConfigMap (in this namespace) holding the private CA
      # PEM the client should trust in addition to the system roots.
      # Mounted read-only and wired to GLOVEBOX_INGEST_CA_FILE when set.
      caConfigMap: ""
      # Key inside caConfigMap holding the PEM bundle.
      caKey: "ca.crt"
      # When true, sets GLOVEBOX_INGEST_REQUIRE_TLS=true, which refuses
      # to run the binary against an http:// gloveboxIngest.url.
      requireTLS: false

# ============================================================================
# walhelm-source (spec 04 / SP3): a SUSPENDED CronJob that runs walhelm-fetch
# to pull a member's walhelm export incrementally and deliver recognized
# subtrees to glovebox. OPT-IN and OFF by default -- with enabled=false the
# chart renders NO walhelm objects at all. Enable per release once the image
# is built and the member's Vault session secret is populated.
#
# Operator prerequisites (one-shot, NOT chart-renderable):
#   - A walhelm session JSON in Vault at the path below (run `walhelm login`,
#     then write the session to secret/walhelm/session/<member>).
#   - The same glovebox NetworkPolicy namespace label as archive-importer:
#       kubectl label ns recognizer name=openclaw-recognizer
# ============================================================================
walhelmSource:
  enabled: false
  image:
    name: walhelm-fetch
    tag: ""
  # data_subject principal for this member, e.g. "walhelm:9f2a". REQUIRED
  # when enabled; passed to the binary as WALHELM_SUBJECT_PRINCIPAL. Also
  # used to select the per-member Vault session path (sessionVault.member
  # defaults to this value).
  subjectPrincipal: ""
  # Cron schedule for the fetch cycle. Only meaningful once `suspend` is
  # lifted by the operator (the rendered CronJob is suspended; see cronjob.yaml).
  schedule: "*/30 * * * *"
  # Per-subject cursor state. Lives on the shared data PVC so cursors survive
  # pod restarts. Maps to WALHELM_STATE_DIR.
  stateDir: /data/walhelm
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  logLevel: info
  # Vault-backed walhelm session JSON. ESO projects it into a Secret that the
  # CronJob mounts read-only at sessionMountPath/sessionFileName; the binary
  # reads it via WALHELM_SESSION_FILE.
  sessionVault:
    # Defaults to .subjectPrincipal when empty. The Vault key becomes
    # secret/walhelm/session/<member> (KV v2 mount "secret"; ESO drops the
    # "secret/" prefix in `key`).
    member: ""
    property: session.json
    refreshInterval: "1m"
    secretStoreRef:
      name: "vault-backend"
      kind: "ClusterSecretStore"
  sessionMountPath: /var/run/walhelm
  sessionFileName: session.json
  # Glovebox archive-delivery target. Mirrors archiveImporter.gloveboxIngest;
  # walhelm-fetch always delivers (the three GLOVEBOX_INGEST_* env are
  # required by the binary), so there is no nested `enabled` toggle here --
  # the whole block is gated by walhelmSource.enabled.
  #
  # Supported glovebox floor: app version 0.6.4 or later. Older versions
  # (≤0.6.3) kill archive uploads >60s via a 60s ReadTimeout; multi-GB
  # uploads fail with curl (55) broken pipe.
  #
  # mTLS covers /v1/ingest only; /v1/archives stays bearer-token auth.
  # Before the operator flips ingest.tls.mode to `required`, verify the
  # deployed glovebox contains the bearer-listener fix (planPlaintextListeners).
  # Without it, /v1/archives goes offline and our uploads get connection-refused.
  #
  # Coming change: config.ingest.bearerPort will split /v1/archives onto
  # its own listener (default 0 = shared 9091). When the operator sets it,
  # update this url's port in the same maintenance window. Full URL is
  # operator-configurable; no code change needed.
  gloveboxIngest:
    url: "http://glovebox.glovebox.svc.cluster.local:9091"
    sourceID: "recognizer-walhelm"
    # Egress target for the CiliumNetworkPolicy (networkpolicies.yaml). Must
    # track the host:port in `url` above -- when the operator lands the
    # bearerPort migration noted above and moves /v1/archives off the shared
    # 9091 listener, update `port` here in the same maintenance window.
    egress:
      namespace: glovebox
      port: 9091
    vault:
      refreshInterval: "1m"
      secretStoreRef:
        name: "vault-backend"
        kind: "ClusterSecretStore"
    # Forward wiring for the day glovebox's bearer listener requires TLS
    # (server side is plaintext today; see
    # docs/analysis/glovebox-integration-review.md §7). Both fields
    # render nothing when left at their defaults, so the default render
    # stays byte-identical.
    tls:
      # Name of a ConfigMap (in this namespace) holding the private CA
      # PEM the client should trust in addition to the system roots.
      # Mounted read-only and wired to GLOVEBOX_INGEST_CA_FILE when set.
      caConfigMap: ""
      # Key inside caConfigMap holding the PEM bundle.
      caKey: "ca.crt"
      # When true, sets GLOVEBOX_INGEST_REQUIRE_TLS=true, which refuses
      # to run the binary against an http:// gloveboxIngest.url.
      requireTLS: false
