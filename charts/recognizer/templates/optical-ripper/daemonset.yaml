{{- if .Values.opticalRipper.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "recognizer.fullname" . }}-optical-ripper
  namespace: {{ include "recognizer.hardwareNamespace" . }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: optical-ripper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "recognizer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: optical-ripper
  template:
    metadata:
      labels:
        {{- include "recognizer.labels" . | nindent 8 }}
        app.kubernetes.io/component: optical-ripper
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.opticalRipper.nodeSelector | nindent 8 }}
      # ARM's container entrypoint refuses to start if /home/arm isn't
      # group-owned by GID 1000 (the in-container 'arm' user). emptyDir
      # volumes default to root:root, so without fsGroup the
      # arm_user_files_setup.sh script bails with
      # "ARM does not have permissions to /home/arm using 1000:1000".
      # fsGroup gives the volume GID 1000 + sets the SGID bit so files
      # ARM creates inherit it. UID stays root for the supervisord-init
      # phase; ARM drops to UID 1000 internally for the ripping process.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Chown the writable mounts ARM checks at startup. fsGroup
        # already sets GID to 1000 on emptyDirs but the entrypoint
        # script's permission check requires UID 1000 too.
        # Also seeds /etc/arm/config from the ConfigMap source -- the
        # ConfigMap volume itself is root-owned and read-only, so we
        # copy its contents into an emptyDir we can chown.
        - name: chown-home
          image: busybox:stable
          env:
            # MakeMKV reads its registration key from
            # /home/arm/.MakeMKV/settings.conf. /home/arm is an emptyDir
            # that resets on every pod restart, so seed the file from
            # the Vault-backed Secret here before ARM starts.
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: makemkv-license
                  key: license-key
          command:
            - sh
            - -c
            - |
              set -e
              cp -r /etc/arm/config-source/. /etc/arm/config/
              # ARM's wrapper refuses to start if its configured
              # COMPLETED_PATH / AUDIO_COMPLETED_PATH / DATA_COMPLETED_PATH
              # don't already exist (it doesn't mkdir them itself), and
              # it bails out before logging anything useful.
              mkdir -p /out/video /out/audio /out/data
              mkdir -p /home/arm/.MakeMKV
              printf 'app_Key = "%s"\n' "$KEY" > /home/arm/.MakeMKV/settings.conf
              chmod 0600 /home/arm/.MakeMKV/settings.conf
              chown -R 1000:1000 /home/arm /out /etc/arm/config
              chmod 0775 /home/arm /out /etc/arm/config /out/video /out/audio /out/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: arm-home
              mountPath: /home/arm
            {{- if .Values.opticalRipper.database.persistence.enabled }}
            # Mounted here too so the chown -R below also fixes ownership on the
            # persistent DB volume (archiver-kx9).
            - name: arm-db
              mountPath: /home/arm/db
            {{- end }}
            - name: arm-config-source
              mountPath: /etc/arm/config-source
              readOnly: true
            - name: arm-config
              mountPath: /etc/arm/config
      containers:
        - name: arm
          image: "{{ .Values.opticalRipper.image.repository }}:{{ .Values.opticalRipper.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ARM_UID
              value: "1000"
            - name: ARM_GID
              value: "1000"
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: makemkv-license
                  key: license-key
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omdb-api
                  key: api-key
            {{- if .Values.hardware.enabled }}
            # Consumed by the optical tender (postStart). See archiver-9vq/7xe.
            - name: ONCONNECT_WITH_DISC
              value: {{ .Values.opticalRipper.onConnectWithDisc | quote }}
            - name: EJECT_GUARD_ENABLED
              value: {{ .Values.opticalRipper.ejectGuard.enabled | quote }}
            - name: EJECT_GUARD_INTERVAL
              value: {{ .Values.opticalRipper.ejectGuard.intervalSeconds | quote }}
            # archiver-9xw: disc-detected/disc-ejected best-effort notification
            # (tender's notify_event, see optical-tender.sh). Same relay URL
            # ARM's own arm.yaml NOTIFY_WEBHOOK config key points at.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NOTIFY_WEBHOOK
              value: {{ include "recognizer.relayUrl" . }}
            {{- end }}
          resources:
            {{- if .Values.hardware.enabled }}
            # Hardware namespace (PSS=privileged): the drive is reached via
            # hostPath /dev below, so no smarter-devices/* claims are needed.
            {{- toYaml .Values.opticalRipper.resources | nindent 12 }}
            {{- else }}
            # Legacy single-namespace (PSS=restricted) path: claim the optical
            # block device + a SCSI-generic node via smarter-device-manager.
            # NOTE: this is fragile -- the drive's sg node is enumeration-
            # dependent (e.g. sg36) but smarter-devices/sg0 is fixed, so the
            # rip usually fails to open the disc. Prefer hardware.enabled.
            requests:
              {{- toYaml .Values.opticalRipper.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.opticalRipper.resources.limits | nindent 14 }}
              smarter-devices/sr0: 1
              smarter-devices/sg0: 1
            {{- end }}
          {{- if .Values.hardware.enabled }}
          # Privileged + hostPath /dev so MakeMKV self-discovers the optical
          # drive (sr0) and its matching SCSI-generic node regardless of the
          # dynamic enumeration order. Contained to the hardware namespace.
          securityContext:
            privileged: true
          # postStart: background the optical tender (archiver-9vq/7xe) -- it
          # handles a disc already loaded at connect and keeps the manual-eject
          # button working when idle. Backgrounded via setsid so the hook
          # returns immediately and never blocks container startup/readiness.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - 'setsid sh /etc/optical-tender/optical-tender.sh >/home/arm/optical-tender.boot.log 2>&1 & exit 0'
          {{- end }}
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: arm-config
              mountPath: /etc/arm/config
            - name: arm-home
              mountPath: /home/arm
            {{- if .Values.opticalRipper.database.persistence.enabled }}
            # Persistent ARM job DB (archiver-kx9): survives pod restarts so
            # dedupe history + per-job metadata are not wiped.
            - name: arm-db
              mountPath: /home/arm/db
            {{- end }}
            {{- if .Values.hardware.enabled }}
            - name: host-dev
              mountPath: /dev
            - name: optical-tender
              mountPath: /etc/optical-tender
              readOnly: true
            {{- end }}
          ports:
            - name: web-ui
              containerPort: 8080
      volumes:
        - name: incoming
          persistentVolumeClaim:
            claimName: {{ include "recognizer.dataClaimName" . }}
        # arm-config is a writable emptyDir that the chown-home init
        # populates from arm-config-source (the ConfigMap below).
        # ARM's startup script needs UID 1000 on the dir, which a
        # ConfigMap mount can't provide (read-only, root-owned).
        - name: arm-config
          emptyDir: {}
        - name: arm-config-source
          configMap:
            name: {{ include "recognizer.fullname" . }}-arm-config
        - name: arm-home
          emptyDir: {}
        {{- if .Values.opticalRipper.database.persistence.enabled }}
        # Persistent ARM job DB volume (archiver-kx9). Mounted at /home/arm/db.
        - name: arm-db
          persistentVolumeClaim:
            claimName: {{ include "recognizer.fullname" . }}-arm-db
        {{- end }}
        {{- if .Values.hardware.enabled }}
        # Host device tree so MakeMKV sees /dev/sr0 + the drive's dynamically-
        # numbered /dev/sg<N>. Requires the privileged securityContext above
        # and the relaxed PSS on the hardware namespace.
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        # optical tender script (archiver-9vq/7xe), run by the postStart hook.
        - name: optical-tender
          configMap:
            name: {{ include "recognizer.fullname" . }}-optical-tender
            defaultMode: 0755
        {{- end }}
{{- end }}
