{{- if .Values.opticalRipper.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "recognizer.fullname" . }}-optical-ripper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: optical-ripper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "recognizer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: optical-ripper
  template:
    metadata:
      labels:
        {{- include "recognizer.labels" . | nindent 8 }}
        app.kubernetes.io/component: optical-ripper
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.opticalRipper.nodeSelector | nindent 8 }}
      # ARM's container entrypoint refuses to start if /home/arm isn't
      # group-owned by GID 1000 (the in-container 'arm' user). emptyDir
      # volumes default to root:root, so without fsGroup the
      # arm_user_files_setup.sh script bails with
      # "ARM does not have permissions to /home/arm using 1000:1000".
      # fsGroup gives the volume GID 1000 + sets the SGID bit so files
      # ARM creates inherit it. UID stays root for the supervisord-init
      # phase; ARM drops to UID 1000 internally for the ripping process.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Belt + suspenders: chown /home/arm to 1000:1000 even though
        # fsGroup should have already adjusted the GID. ARM's script
        # specifically checks for UID 1000 too ("Folder permissions->
        # 0:0" in the error means it saw root:root), and fsGroup only
        # touches the group bit.
        - name: chown-home
          image: busybox:stable
          command: ["sh", "-c", "chown -R 1000:1000 /home/arm /out && chmod 0775 /home/arm /out"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: arm-home
              mountPath: /home/arm
      containers:
        - name: arm
          image: "{{ .Values.opticalRipper.image.repository }}:{{ .Values.opticalRipper.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ARM_UID
              value: "1000"
            - name: ARM_GID
              value: "1000"
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: makemkv-license
                  key: license-key
            - name: OMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omdb-api
                  key: api-key
          resources:
            {{- toYaml .Values.opticalRipper.resources | nindent 12 }}
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: arm-config
              mountPath: /etc/arm/config
            - name: arm-home
              mountPath: /home/arm
          ports:
            - name: web-ui
              containerPort: 8080
      volumes:
        - name: incoming
          persistentVolumeClaim:
            claimName: {{ include "recognizer.dataClaimName" . }}
        - name: arm-config
          configMap:
            name: {{ include "recognizer.fullname" . }}-arm-config
        - name: arm-home
          emptyDir: {}
{{- end }}
