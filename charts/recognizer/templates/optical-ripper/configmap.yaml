{{- if .Values.opticalRipper.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "recognizer.fullname" . }}-arm-config
  namespace: {{ include "recognizer.hardwareNamespace" . }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: optical-ripper
data:
  arm.yaml: |
    # ARM >=2.22 reads INSTALLPATH from the user config to locate the
    # template at <INSTALLPATH>/setup/arm.yaml. The template ships with
    # its own INSTALLPATH default but the user config has to declare
    # it first or the loader (arm/config/config.py:36) blows up with
    # KeyError: 'INSTALLPATH'. Match the in-image install location.
    INSTALLPATH: "/opt/arm/"
    # Lossless archival output, ARM-native (archiver-owa). With RIPMETHOD=mkv,
    # ARM 2.23 always post-processes; USE_FFMPEG=true routes to ffmpeg_mkv ->
    # run_transcode_cmd, which builds `ffmpeg {pre} -i src {post} out`. Setting
    # FFMPEG_POST_FILE_ARGS to "-map 0 -c copy" makes that a STREAM COPY (remux,
    # no re-encode): every video/audio/subtitle track is copied bit-for-bit
    # from the MakeMKV rip into the .mkv (DEST_EXT) at COMPLETED_PATH. Lossless,
    # fast, and done by ARM as designed (no out-of-band copy).
    # NOTE: the old HANDBRAKE_PRESET / RIPMETHOD_DVD / RIPMETHOD_BR keys are not
    # real ARM 2.23 config columns -- do not reintroduce them.
    RIPMETHOD: "mkv"
    USE_FFMPEG: true
    # ARM's template ships FFMPEG_CLI: "FFMPEG" as a placeholder; left unset,
    # ARM execs a nonexistent "FFMPEG" and the remux dies with
    # FileNotFoundError (job fails AFTER a full rip). Point it at the real
    # binary (/usr/bin/ffmpeg in the ARM image).
    FFMPEG_CLI: "/usr/bin/ffmpeg"
    FFMPEG_POST_FILE_ARGS: "-map 0 -c copy"
    DEST_EXT: "mkv"
    # Title length filter (seconds), applied at the OUTPUT stage (ffmpeg.py /
    # handbrake.py): tracks outside [MINLENGTH, MAXLENGTH] are not written to
    # COMPLETED_PATH. MINLENGTH=600 drops trailers/menus/short extras.
    # MAXLENGTH=12600 (3.5h) drops a TV box-set "Play All" title (e.g. a 9x25min
    # disc concatenated to ~3.75h) so the archive holds the individual episodes,
    # not a redundant whole-disc dupe. NOTE: length-only -- a movie longer than
    # 3.5h (rare extended editions) would also be skipped; raise per-disc if so.
    # MakeMKV still RIPS the Play-All to scratch (it only filters the /out copy);
    # ARM's "all" rip has no max-length passthrough to MakeMKV. See archiver-owa.
    MINLENGTH: "600"
    MAXLENGTH: "12600"
    EJECTENABLED: true
    JUSTMAKEISO: false
    COMPLETED_PATH: "/out/video"
    AUDIO_COMPLETED_PATH: "/out/audio"
    DATA_COMPLETED_PATH: "/out/data"
    {{- if .Values.hardware.enabled }}
    # archiver-9xw follow-up: post-rip notification. There is no
    # "NOTIFY_WEBHOOK" (or any other dedicated post-rip) key in ARM 2.23 --
    # that was an earlier, incorrect assumption on this line and has been
    # removed. The real, verified mechanism is the generic BASH_SCRIPT
    # notification hook (arm/ripper/utils.py:88-91 in the upstream
    # automatic-ripping-machine/automatic-ripping-machine tree, tag 2.23.2):
    # ARM execs `bash "$BASH_SCRIPT" "$title" "$body"` on every notify() call,
    # including true job completion (arm/ripper/arm_ripper.py:185,
    # arm/ripper/main.py:132,146). The hook shim + payload are shipped via
    # the arm-hook ConfigMap (hook-configmap.yaml) and mounted at
    # /etc/arm/hooks; it reads NOTIFY_WEBHOOK/NODE_NAME from the container
    # env below (same relay URL, same env vars the tender's notify_event
    # already uses), not from an ARM config key.
    BASH_SCRIPT: "/etc/arm/hooks/hook.sh"
    {{- end }}
{{- end }}
