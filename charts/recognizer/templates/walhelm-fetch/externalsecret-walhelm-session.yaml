{{- if .Values.walhelmSource.enabled }}
{{- $member := .Values.walhelmSource.sessionVault.member | default .Values.walhelmSource.subjectPrincipal -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "recognizer.fullname" . }}-walhelm-session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: walhelm-fetch
spec:
  refreshInterval: {{ .Values.walhelmSource.sessionVault.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ .Values.walhelmSource.sessionVault.secretStoreRef.name | quote }}
    kind: {{ .Values.walhelmSource.sessionVault.secretStoreRef.kind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ include "recognizer.fullname" . }}-walhelm-session
    creationPolicy: Owner
  data:
    # The session JSON lives at secret/walhelm/session/<member> (KV v2 mount
    # "secret"; ESO drops the mount prefix in `key`). The projected Secret key
    # matches walhelmSource.sessionFileName so the CronJob can mount it as a
    # single file at WALHELM_SESSION_FILE.
    - secretKey: {{ .Values.walhelmSource.sessionFileName | quote }}
      remoteRef:
        key: {{ printf "walhelm/session/%s" $member | quote }}
        property: {{ .Values.walhelmSource.sessionVault.property | quote }}
{{- end }}
