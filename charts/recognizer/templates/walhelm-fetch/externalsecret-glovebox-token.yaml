{{- if .Values.walhelmSource.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "recognizer.fullname" . }}-walhelm-glovebox-ingest-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: walhelm-fetch
    app.kubernetes.io/part-of: recognizer
spec:
  refreshInterval: {{ .Values.walhelmSource.gloveboxIngest.vault.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ .Values.walhelmSource.gloveboxIngest.vault.secretStoreRef.name | quote }}
    kind: {{ .Values.walhelmSource.gloveboxIngest.vault.secretStoreRef.kind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ include "recognizer.fullname" . }}-walhelm-glovebox-ingest-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        # Per the glovebox handoff doc: token lives at
        # secret/glovebox/ingest-tokens/<source-id> (KV v2 mount "secret",
        # ESO drops the mount prefix in `key`).
        key: {{ printf "glovebox/ingest-tokens/%s" .Values.walhelmSource.gloveboxIngest.sourceID | quote }}
        property: token
{{- end }}
