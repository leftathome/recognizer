{{- if .Values.documentScanner.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "recognizer.fullname" . }}-document-scanner
  namespace: {{ include "recognizer.hardwareNamespace" . }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-scanner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "recognizer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: document-scanner
  template:
    metadata:
      labels:
        {{- include "recognizer.labels" . | nindent 8 }}
        app.kubernetes.io/component: document-scanner
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.documentScanner.nodeSelector | nindent 8 }}
      containers:
        - name: scanner
          image: {{ include "recognizer.image" (dict "root" $ "name" .Values.documentScanner.image.name "tag" .Values.documentScanner.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No smarter-devices/* claims: the USB scanner is reached via the hostPath
          # /dev mount below (gated on hardware.enabled), not a fixed device resource.
          # NOTE: this workload only functions with hardware.enabled=true. Unlike
          # optical-ripper, there is no smarter-devices fallback in the legacy
          # (hardware.enabled=false) path -- a disabled-hardware render is inert.
          resources:
            {{- toYaml .Values.documentScanner.resources | nindent 12 }}
          {{- if .Values.hardware.enabled }}
          # Privileged + hostPath /dev so SANE/scanimage sees the USB scanner
          # regardless of dynamic bus enumeration. Contained to the hardware namespace.
          securityContext:
            privileged: true
          {{- end }}
          volumeMounts:
            - name: incoming
              mountPath: /out
            - name: scanner-config
              mountPath: /etc/scanner
            {{- if .Values.hardware.enabled }}
            - name: host-dev
              mountPath: /dev
            {{- end }}
          ports:
            - name: web-ui
              containerPort: 8080
      volumes:
        - name: incoming
          persistentVolumeClaim:
            claimName: {{ include "recognizer.dataClaimName" . }}
        - name: scanner-config
          configMap:
            name: {{ include "recognizer.fullname" . }}-scanner-config
        {{- if .Values.hardware.enabled }}
        # Host device tree so scanimage sees the USB scanner at /dev/bus/usb/...
        # Requires the privileged securityContext above and the relaxed PSS on
        # the hardware namespace.
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        {{- end }}
{{- end }}
