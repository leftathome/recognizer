{{- if .Values.documentScanner.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "recognizer.fullname" . }}-scanner-config
  namespace: {{ include "recognizer.hardwareNamespace" . }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-scanner
# The stateless env-only driver (Slice 1) reads no configmap keys;
# all former keys (idle_timeout_seconds, device_name, relay_url, etc.)
# were pruned. The configmap and its daemonset mount are kept so future
# slices can add live config without a chart restructure.
data: {}
{{- end }}
