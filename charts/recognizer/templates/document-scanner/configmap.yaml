{{- if .Values.documentScanner.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "recognizer.fullname" . }}-scanner-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-scanner
data:
  config.yaml: |
    idle_timeout_seconds: 90
    relay_url: {{ include "recognizer.relayUrl" . | quote }}
    scan_resolution: 600
    scan_color_mode: "Color"
    scan_format: "tiff"
    device_name: "epson-ds-1630"
{{- end }}
