{{- if .Values.notificationRelay.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "recognizer.fullname" . }}-notification-relay-tokens
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-relay
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: notification-relay-tokens
    creationPolicy: Owner
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        key: notification-relay
        property: discord-webhook-url
    - secretKey: pushover-token
      remoteRef:
        key: notification-relay
        property: pushover-token
{{- end }}
