{{- /*
  Data volume for hardware-attached workloads (archiver-ztw).

  The optical-ripper (and later document-scanner) live in the hardware
  namespace. PVCs are namespaced, so they need their own /out volume there.

  Two modes (values.hardware.data.mode):

    scratch  Throwaway RWO PVC on a least-durable StorageClass (single
             replica, Delete reclaim). Used while the NAS is unavailable.
             The release-namespace importer CANNOT read this volume, so the
             rip->archive hand-off is deferred until mode=nfs. Adequate to
             validate drive-plug -> rip -> file-on-PVC.

    nfs      Cross-namespace NFS PV+PVC bound to the same export as the
             release-namespace data volume, so the hardware-ns ripper and the
             main-ns importer share /out. Set when the NAS is cabled.
*/ -}}
{{- if .Values.hardware.enabled }}
{{- if eq .Values.hardware.data.mode "scratch" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "recognizer.dataClaimName" . }}
  namespace: {{ include "recognizer.hardwareNamespace" . }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.hardware.data.scratch.accessMode }}
  storageClassName: {{ .Values.hardware.data.scratch.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.hardware.data.scratch.size }}
{{- else if eq .Values.hardware.data.mode "nfs" }}
apiVersion: v1
kind: PersistentVolume
metadata:
  # Distinct from the release-namespace PV (data-pv.yaml); PVs are
  # cluster-scoped so the name must differ even though both target the same
  # NFS export.
  name: {{ include "recognizer.fullname" . }}-data-hw
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ .Values.storage.size }}
  accessModes:
    {{- toYaml .Values.storage.accessModes | nindent 4 }}
  persistentVolumeReclaimPolicy: {{ .Values.storage.nfs.reclaimPolicy }}
  storageClassName: {{ .Values.storage.nfs.storageClassName }}
  nfs:
    server: {{ required "Set storage.nfs.server when hardware.data.mode=nfs" .Values.storage.nfs.server | quote }}
    path: {{ .Values.storage.nfs.path | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "recognizer.dataClaimName" . }}
  namespace: {{ include "recognizer.hardwareNamespace" . }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.storage.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
  storageClassName: {{ .Values.storage.nfs.storageClassName }}
  volumeName: {{ include "recognizer.fullname" . }}-data-hw
{{- end }}
{{- end }}
