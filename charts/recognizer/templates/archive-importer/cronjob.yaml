{{- if .Values.archiveImporter.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "recognizer.fullname" . }}-archive-importer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "recognizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-importer
  annotations:
    recognizer.orac.local/usage: |
      Suspended template. Promote to a Job per spec 03 § 8.1:
        kubectl -n {{ .Release.Namespace }} get cronjob {{ include "recognizer.fullname" . }}-archive-importer -o yaml \
        | yq '.spec.jobTemplate as $jt | $jt
              | .apiVersion = "batch/v1" | .kind = "Job"
              | .metadata.name = "archive-import-<name>-<id>" | .metadata.namespace = "{{ .Release.Namespace }}"
              | .spec.template.spec.containers[0].args = ["ingest", "/data/incoming/archives/raw/<filename>"]' \
        | kubectl apply -f -
spec:
  suspend: true
  schedule: "0 0 1 1 0"          # canonical chart sentinel for an inert
                                 # CronJob; never fires while suspended
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "recognizer.labels" . | nindent 12 }}
            app.kubernetes.io/component: archive-importer
        spec:
          automountServiceAccountToken: false
          serviceAccountName: {{ include "recognizer.fullname" . }}-archive-importer
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          # PVC is owned by uid 1000:1000 (chowned by the optical-ripper
          # init container; first writer to the volume sets the perms).
          # The archive-importer's distroless base default user is
          # nonroot (uid 65532), which doesn't match -- pods fail with
          # 'mkdir /data/incoming/archives/unpacked: permission denied'.
          # Run as 1000:1000 + fsGroup 1000 so writes succeed and any
          # files we create are also group-readable by ARM/relay/etc.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: archive-importer
              image: {{ include "recognizer.image" (dict "root" $ "name" .Values.archiveImporter.image.name "tag" .Values.archiveImporter.image.tag) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: {{ include "recognizer.fullname" . }}-archive-importer
              env:
                # NODE_NAME populates Event.node_name (required by both
                # notification-event v1.0 and v1.1 schemas).
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                {{- if .Values.archiveImporter.gloveboxIngest.enabled }}
                # Glovebox archive-delivery (spec 13 / tus.io). When these
                # are set, recognized subtrees push to glovebox after the
                # matcher pass. URL + sourceID come from Values; the bearer
                # token is materialized by the ExternalSecret in
                # externalsecret-glovebox-token.yaml, but reaches the binary
                # as a mounted file (not env) -- re-read per delivery so
                # Vault rotation propagates in minutes without a pod
                # restart, and so it never sits in /proc/<pid>/environ.
                - name: GLOVEBOX_INGEST_URL
                  value: {{ .Values.archiveImporter.gloveboxIngest.url | quote }}
                - name: GLOVEBOX_INGEST_SOURCE_ID
                  value: {{ .Values.archiveImporter.gloveboxIngest.sourceID | quote }}
                - name: GLOVEBOX_INGEST_TOKEN_FILE
                  value: /var/run/glovebox/token
                {{- if .Values.archiveImporter.gloveboxIngest.tls.caConfigMap }}
                # Forward wiring for the day glovebox's bearer listener
                # requires TLS (server side is plaintext today; see
                # docs/analysis/glovebox-integration-review.md §7).
                - name: GLOVEBOX_INGEST_CA_FILE
                  value: /var/run/glovebox-ca/{{ .Values.archiveImporter.gloveboxIngest.tls.caKey | default "ca.crt" }}
                {{- end }}
                {{- if .Values.archiveImporter.gloveboxIngest.tls.requireTLS }}
                - name: GLOVEBOX_INGEST_REQUIRE_TLS
                  value: "true"
                {{- end }}
                {{- end }}
              args: ["ingest", "/data/incoming/archives/raw/REPLACE-ME.zip"]
              volumeMounts:
                - name: data
                  mountPath: /data/incoming/archives
                {{- if .Values.archiveImporter.gloveboxIngest.enabled }}
                - name: glovebox-ingest-token
                  mountPath: /var/run/glovebox
                  readOnly: true
                {{- if .Values.archiveImporter.gloveboxIngest.tls.caConfigMap }}
                - name: glovebox-ca
                  mountPath: /var/run/glovebox-ca
                  readOnly: true
                {{- end }}
                {{- end }}
              resources:
                {{- toYaml .Values.archiveImporter.resources | nindent 16 }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "recognizer.dataClaimName" . }}
            {{- if .Values.archiveImporter.gloveboxIngest.enabled }}
            - name: glovebox-ingest-token
              secret:
                secretName: {{ include "recognizer.fullname" . }}-glovebox-ingest-token
            {{- if .Values.archiveImporter.gloveboxIngest.tls.caConfigMap }}
            - name: glovebox-ca
              configMap:
                name: {{ .Values.archiveImporter.gloveboxIngest.tls.caConfigMap }}
            {{- end }}
            {{- end }}
{{- end }}
